[phases.setup]
nixPkgs = ["nodejs-18_x", "python311", "python311Packages.pip", "python311Packages.setuptools"]

[phases.install]
cmds = [
  "cd frontend && npm install",
  "pip install --upgrade pip",
  "pip install -r backend/requirements.txt"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "mkdir -p backend/static",
  "cp -r frontend/dist/* backend/static/ || true"
]

[start]
cmd = "cd backend && python3 -m uvicorn api.main:app --host 0.0.0.0 --port $PORT"

