[phases.setup]
nixPkgs = ["nodejs", "python311", "python311Packages.pip", "python311Packages.setuptools"]

[phases.install]
cmds = [
  "cd frontend && rm -rf node_modules package-lock.json && npm install node",
  "python3 -m venv /app/venv",
  "source /app/venv/bin/activate && pip install --upgrade pip",
  "source /app/venv/bin/activate && pip install -r backend/requirements.txt"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "mkdir -p backend/static",
  "cp -r frontend/dist/* backend/static/"
]

[start]
cmd = "cd backend && source /app/venv/bin/activate && python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT"

